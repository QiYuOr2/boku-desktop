// The refresh icon: a circle with an arrowhead, as the mark for "fetch this
// again". It turns while a fetch is running (the caller rotates it), which is
// why the gap and the arrow sit where they do: the shape reads as motion for
// any angle it is drawn at, and it stays recognizable while it spins.
//
// It is a line drawing in the color of the text around it (currentColor), so
// whoever shows it decides that: it is a quiet action at the end of a title
// line, not a button with a face of its own.
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16"
     fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
  <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
  <path d="M21 3v5h-5"/>
</svg>
