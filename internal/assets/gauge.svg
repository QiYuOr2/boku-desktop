<!-- The placeholder mark of a block whose provider has no drawing of its own
     in the repository yet. It is a gauge, which says "a measure" rather than
     pretending to be somebody's brand; the real drawing replaces it when it
     arrives. It is the same 24-unit stroked language as the application's
     other marks, in currentColor, so the block decides the color. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 17a8 8 0 0 1 16 0"/>
  <path d="M12 17l3.5-5"/>
  <circle cx="12" cy="17" r="1.2"/>
</svg>
